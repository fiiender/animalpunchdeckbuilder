<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌数据同步工具（主机用）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #161a20; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 28px; max-width: 560px; width: 100%;
  }
  h1 { font-size: 18px; margin-bottom: 6px; }
  .sub { color: #8b93a5; font-size: 13px; margin-bottom: 18px; }
  .steps { margin: 14px 0 18px; padding-left: 18px; color: #c6ccd8; font-size: 13px; }
  .steps li { margin-bottom: 4px; }
  code {
    background: #0f1115; border: 1px solid rgba(255,255,255,0.1);
    padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #3ea6ff;
  }
  .btn {
    border: 1px solid rgba(255,255,255,0.14); background: #1c2129; color: #e8eaf0;
    border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 14px;
    font-family: inherit; transition: all .15s ease;
  }
  .btn:hover { background: #232a34; border-color: rgba(255,255,255,0.22); }
  .btn.primary { background: #3ea6ff; border-color: transparent; color: #06121f; font-weight: 600; }
  .btn.primary:hover { background: #5ab4ff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    background: #10141a; border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; color: #8b93a5; min-height: 44px; white-space: pre-wrap;
  }
  #status.ok { color: #38d996; border-color: rgba(56,217,150,0.3); }
  #status.err { color: #ff5c6c; border-color: rgba(255,92,108,0.3); }
  #status .small { font-size: 12px; color: #5a6270; }
  .hidden { display: none !important; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="card">
  <h1>卡牌数据同步工具</h1>
  <div class="sub">仅主机使用 · 访客无需打开此页面</div>

  <p style="font-size:13px;color:#c6ccd8;margin-bottom:8px">
    选择仓库中的 <code>index.html</code>，点击「拉取并更新」，工具会：
  </p>
  <ol class="steps">
    <li>请求卡牌 API（animalpunch.cn）获取最新数据</li>
    <li>自动替换 <code>FALLBACK_CARDS</code> 数组</li>
    <li>下载更新后的 <code>index.html</code>，替换仓库原文件后推送即可</li>
  </ol>

  <input type="file" id="file-input" accept=".html,text/html" style="display:none">
  <div class="row">
    <button class="btn" id="btn-select">选择 index.html</button>
    <button class="btn primary" id="btn-sync" disabled>拉取并更新</button>
  </div>
  <div id="file-info" style="margin-top:8px;font-size:12px;color:#5a6270"></div>

  <div id="status">等待选择 index.html 文件…</div>
</div>

<script>
const API_URL = 'https://animalpunch.cn/api/card/queryall';
const PROXY_URL = 'https://proxy.cors.sh/';

let sourceHtml = null;
let sourceName = 'index.html';

const fileInput = document.getElementById('file-input');
const btnSelect = document.getElementById('btn-select');
const btnSync = document.getElementById('btn-sync');
const fileInfo = document.getElementById('file-info');
const statusEl = document.getElementById('status');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function simplifyCard(r) {
  return {
    id: r.id,
    printId: r.printId,
    name: r.name || r.id,
    color: r.color || 'W',
    type: r.type || '',
    rarity: r.rarity || 'N',
    level: r.level || 'Lv0',
    cost: r.cost || '',
    power: typeof r.power === 'number' ? r.power : 0,
    habit: r.habit || '',
    text: r.text || '',
    oracleText: r.oracleText || ''
  };
}

function dedupe(records) {
  const groups = {};
  for (const r of records) {
    if (typeof r !== 'object' || !r || !r.id) continue;
    if (String(r.type || '').includes('衍生')) continue;
    if (!groups[r.id]) groups[r.id] = [];
    groups[r.id].push(r);
  }
  const out = [];
  for (const id of Object.keys(groups).sort((a, b) => {
    const ia = groups[a][0].index ?? 9999, ib = groups[b][0].index ?? 9999;
    return ia - ib;
  })) {
    const rs = groups[id];
    const rep = rs.find(r => r.printId === id) || rs[0];
    out.push(simplifyCard(rep));
  }
  return out;
}

async function fetchJson(url, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('数据为空');
    const cards = dedupe(data);
    if (cards.length === 0) throw new Error('无可构筑卡牌');
    return cards;
  } finally {
    clearTimeout(t);
  }
}

btnSelect.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    sourceHtml = reader.result;
    sourceName = file.name;
    fileInfo.textContent = `已选择：${file.name}（${(file.size / 1024).toFixed(1)} KB）`;
    const ok = sourceHtml.includes('FALLBACK_CARDS');
    btnSync.disabled = !ok;
    if (ok) {
      setStatus('文件读取成功，点击「拉取并更新」开始同步。');
    } else {
      setStatus('错误：所选文件中未找到 FALLBACK_CARDS，请确认选择的是组卡器的 index.html。', 'err');
    }
  };
  reader.readAsText(file);
});

btnSync.addEventListener('click', async () => {
  if (!sourceHtml) return;
  btnSync.disabled = true;
  setStatus('正在请求卡牌 API…');

  let data = null;
  try { data = await fetchJson(API_URL, 5000); }
  catch (e) { console.debug('直连失败，尝试代理:', e.message); }

  if (!data) {
    try { data = await fetchJson(PROXY_URL + API_URL, 12000); }
    catch (e) { console.warn('代理也失败:', e.message); }
  }

  if (!data) {
    setStatus('同步失败：无法连接卡牌 API（直连和代理均失败）。\n请检查网络后重试。', 'err');
    btnSync.disabled = true;
    return;
  }

  setStatus(`已获取 ${data.length} 张卡牌，正在生成新 index.html…`);

  // 生成新的 FALLBACK_CARDS 数组字符串
  const newArr = JSON.stringify(data, null, 2);
  // 转义可能破坏脚本结束标签的内容（如卡牌文本中的 "</SCRIPT"）
  const safe = newArr.replace(/<\/script/gi, '<\\/script');

  // 替换 FALLBACK_CARDS = [...] 部分
  const pattern = /const FALLBACK_CARDS = \[[\s\S]*?\];/;
  if (!pattern.test(sourceHtml)) {
    setStatus('错误：无法定位 FALLBACK_CARDS 数组，文件可能已损坏。', 'err');
    btnSync.disabled = false;
    return;
  }
  const newHtml = sourceHtml.replace(pattern, 'const FALLBACK_CARDS = ' + safe + ';');

  // 下载
  const blob = new Blob([newHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  a.download = `index_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  setStatus(`✔ 同步完成！已生成 index_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.html\n` +
    `包含 ${data.length} 张卡牌。请用下载的文件替换仓库中的 index.html，然后推送到 GitHub。`, 'ok');
  btnSync.disabled = false;
});
</script>
</body>
</html>
